[package]
name = "bootloader"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "UEFI Bootloader for the Janus microkernel operating system."

[dependencies]
boot-info = { version = "0.1.0", path = "../boot-info" }
log = "0.4"
uefi = { version = "0.39.0", features = ["alloc", "global_allocator", "logger", "panic_handler"] }
x86_64 = "0.15"
xmas-elf = "0.9"

[[bin]]
name = "bootloader"
path = "src/main.rs"
test = false
