name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Host Checks
        run: |
          cargo +nightly check -p boot-info
          cargo +nightly check -p kernel --lib
          cargo +nightly test -p boot-info
          cargo +nightly test -p kernel --lib

      - name: Bare-Metal Checks
        run: |
          cargo +nightly build -p kernel --target x86_64-unknown-none -Zbuild-std=core,compiler_builtins,alloc
          cargo +nightly build -p bootloader --target x86_64-unknown-uefi -Zbuild-std=core,compiler_builtins,alloc
