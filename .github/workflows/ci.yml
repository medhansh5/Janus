name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  rust:
    name: Code Formatting & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy, rust-src, llvm-tools-preview
          targets: x86_64-unknown-none, x86_64-unknown-uefi

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter (Host Crates)
        run: |
          cargo clippy -p boot-info -- -D warnings
          cargo clippy -p kernel --lib -- -D warnings

  build-and-test:
    name: Target Builds & Host Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none, x86_64-unknown-uefi

      - name: Host Unit Tests
        run: |
          cargo check -p boot-info
          cargo check -p kernel --lib
          cargo test -p boot-info
          cargo test -p kernel --lib

      - name: Kernel Target Build (x86_64-unknown-none)
        run: |
          cargo build -p kernel --target x86_64-unknown-none -Zbuild-std=core,compiler_builtins,alloc

      - name: Bootloader Target Build (x86_64-unknown-uefi)
        run: |
          cargo build -p bootloader --target x86_64-unknown-uefi -Zbuild-std=core,compiler_builtins,alloc
